<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buildwise AI</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --border-color: #30363d;
            --text-color: #c9d1d9;
            --accent-color: #238636;
            --accent-hover: #2ea043;
            --user-bubble: #1f6feb;
            --ai-bubble: #21262d;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 { font-size: 1.2rem; margin: 0; color: #ffffff; }
        button {
            background-color: var(--panel-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        button:hover { background-color: var(--border-color); }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            box-sizing: border-box;
        }
        .message {
            padding: 12px 16px;
            border-radius: 12px;
            max-width: 85%;
            line-height: 1.5;
            word-break: break-word;
            position: relative;
        }
        .user-message {
            background-color: var(--user-bubble);
            color: #ffffff;
            align-self: flex-end;
        }
        .ai-message {
            background-color: var(--ai-bubble);
            color: var(--text-color);
            align-self: flex-start;
            border: 1px solid var(--border-color);
        }
        .ai-message img { max-width: 100%; border-radius: 8px; margin-top: 10px; display: block; }
        .copy-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(0,0,0,0.3);
            border: none;
            color: #fff;
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 4px;
            cursor: pointer;
        }
        .input-area {
            background-color: var(--panel-bg);
            border-top: 1px solid var(--border-color);
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            box-sizing: border-box;
        }
        .input-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        textarea {
            flex: 1;
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            resize: none;
            height: 40px;
            font-family: inherit;
        }
        .tools-row {
            display: flex;
            gap: 10px;
            align-items: center;
            font-size: 0.85rem;
        }
        .file-label {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
        }
        #file-name { font-size: 0.8rem; color: #8b949e; }
        .primary-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            font-weight: bold;
        }
        .primary-btn:hover { background-color: var(--accent-hover); }
        .mic-btn {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 12px;
            cursor: pointer;
        }
        .mic-btn.listening {
            background-color: #da3633;
            color: white;
            border-color: #f85149;
        }
        /* Settings Modal */
        #settings-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: var(--panel-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            width: 90%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .modal-content input {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <header>
        <h1>BUILDWISE AI</h1>
        <button onclick="toggleSettings()">⚙️ Settings</button>
    </header>

    <div id="chat-container">
        <div class="message ai-message">Hello! I am Buildwise AI. You can chat with me, upload documents, send photos/camera pictures, use voice input, or ask me to generate images!</div>
    </div>

    <div class="input-area">
        <div class="tools-row">
            <label class="file-label">📷 Camera <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none" onchange="handleFile(this)"></label>
            <label class="file-label">🖼️ Photo <input type="file" id="photoInput" accept="image/*" style="display:none" onchange="handleFile(this)"></label>
            <label class="file-label">📄 Document <input type="file" id="docInput" accept=".pdf,.txt,.csv,.doc,.docx" style="display:none" onchange="handleFile(this)"></label>
            <span id="file-name"></span>
        </div>
        <div class="input-row">
            <button id="micBtn" class="mic-btn" onclick="toggleSpeechRecognition()" title="Voice Input">🎙️</button>
            <textarea id="userInput" placeholder="Type a message, ask to generate an image, or upload a doc..." rows="1" onkeydown="handleKeyDown(event)"></textarea>
            <button class="primary-btn" onclick="sendMessage()">Generate ⚡</button>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal">
        <div class="modal-content">
            <h3>Gemini API Key</h3>
            <input type="password" id="apiKeyInput" placeholder="Paste your AIza... key here">
            <button class="primary-btn" onclick="saveApiKey()">Save Key & Close</button>
        </div>
    </div>

    <script>
        const MODEL_NAME = 'gemini-2.5-flash';
        let chatHistory = [];
        let attachedFile = null;
        let recognition = null;

        // Initialize Speech Recognition for Mic
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            recognition.onresult = function(event) {
                const speechToText = event.results[0][0].transcript;
                document.getElementById('userInput').value += ' ' + speechToText;
                stopListeningUI();
            };

            recognition.onerror = function() {
                stopListeningUI();
            };

            recognition.onend = function() {
                stopListeningUI();
            };
        }

        function toggleSpeechRecognition() {
            if (!recognition) {
                alert('Speech recognition is not supported in this browser. Try using Google Chrome.');
                return;
            }
            const btn = document.getElementById('micBtn');
            if (btn.classList.contains('listening')) {
                recognition.stop();
                stopListeningUI();
            } else {
                recognition.start();
                btn.classList.add('listening');
                btn.innerText = '🔴';
            }
        }

        function stopListeningUI() {
            const btn = document.getElementById('micBtn');
            btn.classList.remove('listening');
            btn.innerText = '🎙️';
        }

        function toggleSettings() {
            const modal = document.getElementById('settings-modal');
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
            if(modal.style.display === 'flex') {
                document.getElementById('apiKeyInput').value = localStorage.getItem('gemini_api_key') || '';
            }
        }

        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            localStorage.setItem('gemini_api_key', key);
            toggleSettings();
            alert('API Key Saved!');
        }

        function handleFile(input) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    const base64String = e.target.result.split(',')[1];
                    attachedFile = {
                        data: base64String,
                        mimeType: file.type || 'application/pdf',
                        name: file.name
                    };
                    document.getElementById('file-name').innerText = `📎 ${file.name}`;
                };

                reader.onerror = function() {
                    alert('Error reading file. Please try another file.');
                };

                reader.readAsDataURL(file);
            }
        }

        function handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        async function sendMessage() {
            const apiKey = localStorage.getItem('gemini_api_key');
            if (!apiKey) {
                alert('Please set your Gemini API Key in Settings first.');
                toggleSettings();
                return;
            }

            const inputField = document.getElementById('userInput');
            const text = inputField.value.trim();
            if (!text && !attachedFile) return;

            // Check if user is asking for image generation
            const isImageGen = text.toLowerCase().startsWith('generate image') || 
                               text.toLowerCase().startsWith('draw') || 
                               text.toLowerCase().startsWith('create an image');

            let displayUserText = text || `[Attached: ${attachedFile.name}]`;
            appendMessage(displayUserText, 'user-message');
            inputField.value = '';

            // Handle Image Generation Request Separately
            if (isImageGen && !attachedFile) {
                const promptQuery = text.replace(/^(generate image of|draw|create an image of)\s*/i, '');
                const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(promptQuery)}?width=1024&height=1024&nologo=true`;
                
                chatHistory.push({ role: 'user', parts: [{ text: text }] });
                const imageMarkdown = `Here is your generated image:\n\n![${promptQuery}](${imageUrl})`;
                chatHistory.push({ role: 'model', parts: [{ text: imageMarkdown }] });
                
                appendMessage(imageMarkdown, 'ai-message');
                return;
            }

            // Build payload for Gemini API
            let currentParts = [];
            if (text) currentParts.push({ text: text });
            if (attachedFile) {
                currentParts.push({
                    inlineData: {
                        mimeType: attachedFile.mimeType,
                        data: attachedFile.data
                    }
                });
            }

            chatHistory.push({ role: 'user', parts: currentParts });
            
            // Clear attachment UI
            const currentAttachment = attachedFile;
            attachedFile = null;
            document.getElementById('file-name').innerText = '';

            const loadingId = appendMessage('Thinking...', 'ai-message');

            try {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${apiKey}`;
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: chatHistory })
                });

                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error.message);
                }

                const reply = data.candidates[0].content.parts[0].text;
                
                chatHistory.push({ role: 'model', parts: [{ text: reply }] });
                updateMessage(loadingId, reply);

            } catch (err) {
                updateMessage(loadingId, `❌ Error: ${err.message}`);
                chatHistory.pop(); 
                attachedFile = currentAttachment; // restore on failure
            }
        }

        function appendMessage(text, className) {
            const container = document.getElementById('chat-container');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            
            const msgId = 'msg-' + Math.random().toString(36).substring(2, 9);
            msgDiv.id = msgId;

            if (className === 'ai-message') {
                msgDiv.innerHTML = marked.parse(text);
                const copyBtn = document.createElement('button');
                copyBtn.className = 'copy-btn';
                copyBtn.innerText = 'Copy';
                copyBtn.onclick = () => {
                    const rawText = text.replace(/!\[.*?\]\(.*?\)/g, ''); // strip markdown image for clean copy
                    navigator.clipboard.writeText(rawText);
                    copyBtn.innerText = 'Copied!';
                    setTimeout(() => copyBtn.innerText = 'Copy', 2000);
                };
                msgDiv.appendChild(copyBtn);
            } else {
                msgDiv.innerText = text;
            }

            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
            return msgId;
        }

        function updateMessage(id, text) {
            const msgDiv = document.getElementById(id);
            if (msgDiv) {
                msgDiv.innerHTML = marked.parse(text);
                const copyBtn = document.createElement('button');
                copyBtn.className = 'copy-btn';
                copyBtn.innerText = 'Copy';
                copyBtn.onclick = () => {
                    const rawText = text.replace(/!\[.*?\]\(.*?\)/g, '');
                    navigator.clipboard.writeText(rawText);
                    copyBtn.innerText = 'Copied!';
                    setTimeout(() => copyBtn.innerText = 'Copy', 2000);
                };
                msgDiv.appendChild(copyBtn);
                
                const container = document.getElementById('chat-container');
                container.scrollTop = container.scrollHeight;
            }
        }
    </script>
</body>
</html>
